; PlatformIO Project Configuration File
;
; SD2 小电视 DeepSeek 余额显示器
; 硬件参考: https://github.com/Jason6111/sd2
;
; 使用前请先修改 src/config.h 中的 WiFi 和 API Key

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@^3.2.0
board = nodemcuv2
framework = arduino
monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp8266_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^6.20.0
    adafruit/Adafruit NeoPixel@^1.12.0

; TFT_eSPI: 通过编译宏配置 ST7789 240x240（SD2 无 CS，MISO 未接）
; 引脚对应: DC=GPIO0(D3) RST=GPIO2(D4) SCLK=GPIO14(D5) MOSI=GPIO13(D7)
; 背光 GPIO5(D1) 在 config.h 中定义
build_flags =
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DSPI_FREQUENCY=40000000
    ; TFT_eSPI 内置字体（FreeFonts）
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT7
    -DLOAD_GFXFF
