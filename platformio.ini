; PlatformIO Project Configuration File
;
; SD2 小电视 DeepSeek 余额显示器
; 硬件参考: https://github.com/Jason6111/sd2
;
; 公共板级配置与基础代码来自子模块 lib/sd2-common
;（git clone --recursive 后自动就位）
; 本工程只保留自身差异：额外字体宏、依赖。
; 使用前请先修改 src/config.h 中的 WiFi 和 API Key

[platformio]
default_envs = nodemcuv2
extra_configs = lib/sd2-common/platformio/sd2-st7789.ini

[env:nodemcuv2]
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^6.20.0
    lib/sd2-common

; TFT_eSPI: 本工程用到内置大号字体（Font7 七段数字 + FreeSans）
; 屏幕驱动/引脚等硬件常量在 lib/sd2-common/platformio/tft_setup.h（固定，无需改）
build_flags =
    ${common.sd2_flags}
    -DLOAD_FONT7
    -DLOAD_GFXFF
